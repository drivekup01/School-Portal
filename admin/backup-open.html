<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เปิดไฟล์สำรองโรงเรียน · ออฟไลน์</title><style>body{font:16px/1.6 Tahoma,sans-serif;background:#f7f5fa;color:#30203f;max-width:650px;margin:7vh auto;padding:22px}main{padding:25px;background:white;border-radius:16px;border:1px solid #e6daee}label{display:grid;gap:6px;margin:15px 0}input,button{font:inherit;padding:11px;border:1px solid #ddcfe7;border-radius:8px;min-width:0}button{background:#813bb1;color:white;cursor:pointer}p{white-space:pre-wrap}small{color:#84718e}</style></head><body><main><h1>เปิดไฟล์สำรองเข้ารหัส</h1><p>เครื่องมือนี้ทำงานในเครื่อง ไม่อัปโหลดไฟล์หรือรหัสผ่าน และเปิดใช้แบบออฟไลน์ได้</p><form id="form"><label>ไฟล์ .kbwbackup<input id="file" type="file" accept=".kbwbackup" required></label><label>รหัสผ่านไฟล์<input id="password" type="password" maxlength="128" required autocomplete="off"></label><button id="open">ถอดรหัสและดาวน์โหลด ZIP</button></form><p id="status" role="status"></p><small>ZIP ที่ได้มีข้อมูลส่วนบุคคล เก็บในที่ปลอดภัย การเปิดไฟล์นี้ไม่ได้กู้ข้อมูลเข้าเว็บไซต์</small></main><script>(function(global){
'use strict';
const encoder=new TextEncoder(),decoder=new TextDecoder('utf-8',{fatal:true}),magic=encoder.encode('KBWBACKUP1\n'),iterations=310000;
const b64=b=>btoa(String.fromCharCode(...b)),un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(password,salt){if(typeof password!=='string'||password.length>128)throw Error('รหัสผ่านไม่ถูกต้อง');const raw=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function pack(bytes,password,filename){if(password.length<12)throw Error('ใช้รหัสผ่านอย่างน้อย 12 ตัวอักษร');if(!/^[a-zA-Z0-9_.-]{1,170}\.zip$/.test(filename))throw Error('ชื่อไฟล์ไม่ถูกต้อง');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),header=encoder.encode(JSON.stringify({format:'kbw-school-backup',version:1,cipher:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations,salt:b64(salt),iv:b64(iv),filename})),encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:header,tagLength:128},await key(password,salt),bytes)),out=new Uint8Array(magic.length+4+header.length+encrypted.length);out.set(magic);new DataView(out.buffer).setUint32(magic.length,header.length);out.set(header,magic.length+4);out.set(encrypted,magic.length+4+header.length);return out;}
async function unpack(bytes,password){if(!(bytes instanceof Uint8Array)||bytes.length<magic.length+20||!magic.every((b,i)=>bytes[i]===b))throw Error('ไฟล์นี้ไม่ใช่ชุดสำรองที่เข้ารหัสของระบบ');const size=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength).getUint32(magic.length);if(size<20||size>4096||magic.length+4+size+16>bytes.length)throw Error('หัวไฟล์สำรองเสียหาย');const header=bytes.slice(magic.length+4,magic.length+4+size);let v;try{v=JSON.parse(decoder.decode(header));}catch{throw Error('หัวไฟล์สำรองเสียหาย');}if(v.format!=='kbw-school-backup'||v.version!==1||v.cipher!=='AES-256-GCM'||v.kdf!=='PBKDF2-SHA256'||v.iterations!==iterations||typeof v.salt!=='string'||typeof v.iv!=='string'||!/^[a-zA-Z0-9_.-]{1,170}\.zip$/.test(v.filename))throw Error('รูปแบบไฟล์ไม่รองรับ');const salt=un64(v.salt),iv=un64(v.iv);if(salt.length!==16||iv.length!==12)throw Error('หัวไฟล์ไม่ถูกต้อง');try{return {filename:v.filename,bytes:new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:header,tagLength:128},await key(password,salt),bytes.slice(magic.length+4+size)))};}catch{throw Error('รหัสผ่านไม่ถูกต้องหรือไฟล์เสียหาย');}}
global.KBWBackupCrypto={pack,unpack};
})(typeof window==='object'?window:globalThis);

const form=document.getElementById('form'),button=document.getElementById('open'),status=document.getElementById('status');form.onsubmit=async event=>{event.preventDefault();const file=document.getElementById('file').files[0];if(!file)return;if(file.size>300*1024*1024){status.textContent='ไฟล์ใหญ่เกินขอบเขตเครื่องมือนี้';return;}button.disabled=true;status.textContent='กำลังถอดรหัสในเครื่อง…';try{const result=await KBWBackupCrypto.unpack(new Uint8Array(await file.arrayBuffer()),document.getElementById('password').value),url=URL.createObjectURL(new Blob([result.bytes],{type:'application/zip'})),a=document.createElement('a');a.href=url;a.download=result.filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='ถอดรหัสแล้ว: '+result.filename;document.getElementById('password').value='';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};</script></body></html>
