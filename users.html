<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีผู้ใช้กลาง · ระบบงานโรงเรียน</title><style>body{font:14px Tahoma,system-ui;color:#33213f;background:#faf7fd;margin:0;padding:26px}main{max-width:1150px;margin:auto}h1{font-size:26px}h2{font-size:19px}p{line-height:1.8;color:#897196}section{background:white;border:1px solid #e6d8f0;border-radius:20px;padding:24px;margin:22px 0}button,.button{font:inherit;border:1px solid #d9c2e9;background:#714198;color:white;border-radius:11px;padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#f6f0fb;color:#714198}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}label{display:grid;gap:7px;color:#79568e}input,select{font:inherit;min-height:45px;border:1px solid #dcc8e9;border-radius:10px;padding:10px;box-sizing:border-box;width:100%}.check{display:flex;align-items:center;gap:10px;margin-top:20px}.check input{width:19px;min-height:19px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:13px 10px;text-align:left;border-bottom:1px solid #eee4f4;white-space:nowrap}small{display:block;color:#9c85ab;overflow-wrap:anywhere;white-space:normal}#status{color:#714198}@media(max-width:650px){body{padding:17px}.fields{grid-template-columns:1fr}section{padding:19px}}</style></head><body><main><a class="button secondary" href="index.html">← หน้าเลือกระบบ</a><h1>บัญชีผู้ใช้กลาง</h1><p>เพิ่มครูครั้งเดียว แล้วกำหนดสิทธิ์ของแต่ละระบบจากหน้านี้</p><button id="login">เข้าสู่ระบบด้วย Google</button><button id="redirectLogin" class="secondary">ล็อกอินแบบหน้าเต็ม</button><button id="logout" class="secondary">ออกจากระบบ</button><p id="who">กำลังตรวจบัญชี…</p><p id="status" role="status"></p><div id="workspace" hidden><section><h2 id="formTitle">อนุมัติบัญชีใหม่ด้วยอีเมล</h2><p>เจ้าของบัญชีจะได้รับสิทธิ์เมื่อเข้าสู่ Google ครั้งแรก ส่วนรหัสครูใช้เชื่อมกับข้อมูลตารางสอนเดิม</p><form id="userForm"><div class="fields"><label>อีเมล<input name="email" id="email" type="email" required></label><label>ชื่อ–สกุล<input name="name" maxlength="160" required></label><label>รหัสครูในตารางสอน<input name="teacherId" maxlength="100"></label><label>สิทธิ์ตารางสอน<select name="timetableRole"><option value="viewer">ดูอย่างเดียว</option><option value="academic">ฝ่ายวิชาการ</option><option value="none">ไม่กำหนด</option></select></label><label>สิทธิ์เช็คชื่อ<select name="attendanceRole"><option value="none">ไม่กำหนด</option><option value="teacher">ครู</option><option value="admin">ผู้ดูแลเช็คชื่อ</option></select></label><label>สิทธิ์งบประมาณ<select name="budgetRole"><option value="none">ไม่กำหนด</option><option value="editor">เจ้าหน้าที่</option><option value="admin">ผู้ดูแลงบประมาณ</option></select></label></div><label class="check"><input type="checkbox" name="active" checked> เปิดใช้งานบัญชี</label><label class="check"><input type="checkbox" name="identityAdmin"> ผู้ดูแลบัญชีผู้ใช้กลาง</label><button type="submit" id="save">บันทึกบัญชีและสิทธิ์</button><button type="button" class="secondary" id="new">เพิ่มบัญชีใหม่</button></form></section><section><h2>ผู้ใช้ที่เชื่อมบัญชีแล้ว</h2><button id="reload" class="secondary">โหลดใหม่</button><div id="users" class="table-wrap"></div></section><section><h2>บัญชีที่อนุมัติล่วงหน้า</h2><div id="invites" class="table-wrap"></div></section></div></main><script type="module" src="users.js"></script></body></html>
